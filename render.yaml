databases:
  - name: flowstock-db
    region: oregon
    plan: free
    databaseName: flowstock
    user: flowstock
    postgresMajorVersion: "17"

services:
  - type: web
    name: flowstock-api
    runtime: docker
    region: oregon
    plan: free
    rootDir: Bakend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /app/render-start.sh
    healthCheckPath: /healthz/
    autoDeployTrigger: off
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ALLOWED_HOSTS
        fromService:
          name: flowstock-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: flowstock-db
          property: connectionString
      - key: ACTIVER_DOCUMENTATION_API
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
