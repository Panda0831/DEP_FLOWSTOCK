name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Django
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bakend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Bakend/requirements.txt
            Bakend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python style
        run: ruff check .

      - name: Check Django configuration
        run: python manage.py check --settings=config.settings.test

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run backend tests
        run: pytest -q

  mobile:
    name: Mobile · Expo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

  backend-image:
    name: Backend · Docker image
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          echo "name=ghcr.io/${owner}/${repository}-api" >> "$GITHUB_OUTPUT"

      - name: Prepare image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./Bakend
          file: ./Bakend/Dockerfile
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
