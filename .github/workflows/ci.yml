name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend · Django
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: Bakend
        env:
            DJANGO_SECRET_KEY: ci-only-secret-key
            DJANGO_SETTINGS_MODULE: config.settings.test
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: |
                      Bakend/requirements.txt
                      Bakend/requirements-dev.txt

            - name: Install backend dependencies
              run: python -m pip install -r requirements-dev.txt

            - name: Check Python style
              run: ruff check .

            - name: Check Django configuration
              run: python manage.py check --settings=config.settings.test

            - name: Check migrations
              run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

            - name: Run backend tests
              run: pytest -q

    mobile:
        name: Mobile · Expo
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: Frontend/mobile
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: Frontend/mobile/package-lock.json

            - name: Install mobile dependencies
              run: npm ci

            - name: Check ESLint
              run: npm run lint

            - name: Check TypeScript
              run: npx tsc --noEmit

    backend-image:
        name: Backend · Docker image
        needs: [backend, mobile]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Set image name
              id: image
              run: |
                  owner="${GITHUB_REPOSITORY_OWNER,,}"
                  repository="${GITHUB_REPOSITORY#*/}"
                  repository="${repository,,}"
                  echo "name=ghcr.io/${owner}/${repository}-api" >> "$GITHUB_OUTPUT"

            - name: Prepare image tags and labels
              id: metadata
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=ref,event=tag
                      type=sha

            - name: Log in to GitHub Container Registry
              if: startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build backend image
              uses: docker/build-push-action@v7
              with:
                  context: ./Bakend
                  file: ./Bakend/Dockerfile
                  platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
                  push: ${{ startsWith(github.ref, 'refs/tags/v') }}
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}

    deploy-vps:
        name: Deploy backend · VPS
        needs: [backend-image]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.VPS_DEPLOY_ENABLED == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: read
        env:
            VPS_HOST: ${{ secrets.VPS_HOST }}
            VPS_USER: ${{ secrets.VPS_USER }}
            VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
            VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
            VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
            VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
            GHCR_USERNAME: ${{ github.actor }}
            GHCR_PULL_TOKEN: ${{ github.token }}
        steps:
            - name: Checkout deployment files
              uses: actions/checkout@v7

            - name: Validate deployment settings and configure SSH
              shell: bash
              run: |
                  set -Eeuo pipefail

                  for name in VPS_HOST VPS_USER VPS_SSH_PORT VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS VPS_DEPLOY_PATH GHCR_USERNAME GHCR_PULL_TOKEN; do
                    if [[ -z "${!name}" ]]; then
                      echo "Required GitHub secret is missing: ${name}" >&2
                      exit 1
                    fi
                  done

                  [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "VPS_HOST must be an IPv4 address or DNS name." >&2; exit 1; }
                  [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$VPS_USER" != root ]] || { echo "VPS_USER must be a non-root Linux account name." >&2; exit 1; }
                  [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]] || { echo "The workflow actor is not a valid GHCR username." >&2; exit 1; }
                  [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( VPS_SSH_PORT >= 1 && VPS_SSH_PORT <= 65535 )) || { echo "VPS_SSH_PORT must be between 1 and 65535." >&2; exit 1; }
                  [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ && "$VPS_DEPLOY_PATH" != "/" && ! "$VPS_DEPLOY_PATH" =~ (^|/)\.\.?(/|$) ]] || { echo "VPS_DEPLOY_PATH must be a safe absolute path without dot segments or spaces." >&2; exit 1; }
                  [[ "$GITHUB_REF_NAME" =~ ^v[A-Za-z0-9._-]{1,127}$ ]] || { echo "The version tag must also be a valid Docker tag." >&2; exit 1; }

                  install -m 700 -d "$HOME/.ssh"
                  printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
                  printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
                  chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

            - name: Deploy the published image over verified SSH
              shell: bash
              run: |
                  set -Eeuo pipefail
                  trap 'rm -f "$HOME/.ssh/id_ed25519"' EXIT

                  image="ghcr.io/${GITHUB_REPOSITORY,,}-api:${GITHUB_REF_NAME}"
                  ssh_options=(
                    -p "$VPS_SSH_PORT"
                    -o BatchMode=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
                    -o ConnectTimeout=15
                    -o ServerAliveInterval=30
                    -o IdentitiesOnly=yes
                    -i "$HOME/.ssh/id_ed25519"
                  )

                  ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_DEPLOY_PATH'"
                  scp -P "$VPS_SSH_PORT" \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                    -o ConnectTimeout=15 \
                    -o IdentitiesOnly=yes \
                    -i "$HOME/.ssh/id_ed25519" \
                    deploy/vps/compose.yml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/compose.yml.new"

                  remote_script=$(cat <<REMOTE
                  set -eu
                  IFS= read -r ghcr_pull_token
                  docker_config=\$(mktemp -d)
                  trap 'rm -rf "\$docker_config"' EXIT
                  export DOCKER_CONFIG="\$docker_config"
                  printf '%s' "\$ghcr_pull_token" | docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin
                  unset ghcr_pull_token
                  cd '$VPS_DEPLOY_PATH'
                  mv compose.yml.new compose.yml
                  test -f .env
                  chmod 600 .env
                  export FLOWSTOCK_IMAGE='$image'
                  docker compose --file compose.yml config --quiet
                  docker compose --file compose.yml pull api
                  docker compose --file compose.yml up -d --wait db
                  docker compose --file compose.yml run --rm api python manage.py migrate --noinput --settings=config.settings.prod
                  docker compose --file compose.yml run --rm api python manage.py collectstatic --noinput --settings=config.settings.prod
                  docker compose --file compose.yml up -d --wait --remove-orphans
                  docker compose --file compose.yml ps
                  REMOTE
                  )
                  printf '%s\n' "$GHCR_PULL_TOKEN" | ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "$remote_script"
