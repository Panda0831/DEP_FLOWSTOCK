name: flowstock

services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env}
            POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - backend

    api:
        image: ${FLOWSTOCK_IMAGE:?Définir FLOWSTOCK_IMAGE pour l’image GHCR publiée}
        restart: unless-stopped
        init: true
        environment:
            DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Définir DJANGO_SECRET_KEY dans .env}
            DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
            ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Définir ALLOWED_HOSTS dans .env}
            DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
            ACTIVER_DOCUMENTATION_API: ${ACTIVER_DOCUMENTATION_API:-False}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
            CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
            SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
            CSRF_COOKIE_SAMESITE: ${CSRF_COOKIE_SAMESITE:-Lax}
            SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
        ports:
            - "127.0.0.1:${FLOWSTOCK_API_PORT:-8000}:8000"
        volumes:
            - static_files:/app/staticfiles
            - media_files:/app/media
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz/', timeout=3)
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        networks:
            - backend

networks:
    backend:
        driver: bridge

volumes:
    postgres_data:
    static_files:
    media_files:
