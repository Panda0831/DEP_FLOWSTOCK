openapi: 3.0.3
info:
  title: API StockFlow
  version: 1.0.0
  description: API de gestion des comptes et de l’authentification StockFlow.
paths:
  /api/v1/auth/login/:
    post:
      operationId: authentifier_utilisateur
      description: 'Accès public. Les tentatives sont limitées par adresse IP et par
        e-mail normalisé, y compris si aucun compte ne correspond. Les réponses portent
        Cache-Control: no-store et Pragma: no-cache. Un 401 inclut WWW-Authenticate:
        Bearer; un 429 inclut Retry-After en secondes.'
      summary: Ouvrir une session avec une paire JWT
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connexion'
            examples:
              RequêteDeConnexion:
                value:
                  email: rakoto@exemple.com
                  mot_de_passe: MotDePasseFort!2026
                summary: Identifiants de connexion
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReponseConnexion'
              examples:
                Succes:
                  value:
                    access: <jeton_acces_exemple>
                    refresh: <jeton_rafraichissement_exemple>
                    utilisateur:
                      uuid: 3f1c2b7e-8a4d-4c1e-9b6a-2d5f7e8a9c10
                      email: rakoto@exemple.com
                      nom: Rakoto
                      prenom: Hery
                      role: vendeur
                      doit_changer_mot_de_passe: false
                  summary: Connexion réussie
                  description: Paire de jetons et résumé du compte.
          description: 'Connexion réussie. Cache-Control: no-store.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
              examples:
                Validation:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: donnees_invalides
                    erreurs:
                      email:
                      - Saisissez une adresse e-mail valide.
                  summary: E-mail invalide
                  description: Erreur de validation des champs.
                ChampsInconnus:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: champs_inconnus
                    erreurs:
                      champs_inconnus:
                      - 'Champs non autorisés : role'
                  summary: Champ inconnu
                  description: Le corps contient un champ non autorisé.
                JsonMalforme:
                  value:
                    detail: Le corps JSON est invalide.
                    code: donnees_invalides
                    erreurs: {}
                  summary: JSON malformé
                  description: Le corps ne peut pas être analysé.
          description: Entrée invalide, JSON malformé ou champ inconnu.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                IdentifiantsInvalides:
                  value:
                    detail: E-mail ou mot de passe incorrect.
                    code: identifiants_invalides
                  summary: Identifiants incorrects
                  description: Même réponse pour un compte inconnu, inactif ou un
                    mot de passe erroné.
          description: 'Identifiants incorrects. En-têtes WWW-Authenticate: Bearer
            et Cache-Control: no-store.'
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                MethodeNonAutorisee:
                  value:
                    detail: Méthode non autorisée.
                    code: methode_non_autorisee
                  summary: Méthode interdite
                  description: La route accepte uniquement POST.
          description: 'Méthode non autorisée. Cache-Control: no-store.'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
              examples:
                TypeContenuNonPrisEnCharge:
                  value:
                    detail: Le type de contenu n’est pas pris en charge.
                    code: donnees_invalides
                    erreurs: {}
                  summary: Type de contenu non pris en charge
                  description: Le corps doit être transmis en application/json.
          description: Type de contenu non pris en charge.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                TropDeRequetes:
                  value:
                    detail: Trop de requêtes. Réessayez après le délai indiqué.
                    code: trop_de_requetes
                  summary: Limite atteinte
                  description: La réponse contient le délai Retry-After.
          description: Limite de débit atteinte; Retry-After est exprimé en secondes.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                ErreurInterne:
                  value:
                    detail: Erreur interne du serveur.
                    code: erreur_interne
                  summary: Erreur interne
                  description: Aucun détail technique n’est exposé.
          description: Erreur interne sans détail technique.
  /api/v1/auth/logout/:
    post:
      operationId: deconnecter_utilisateur
      description: Exige un jeton d’accès valide et un jeton de rafraîchissement appartenant
        au même compte. La révocation est idempotente. Les tentatives sont limitées
        par adresse IP; les succès et refus sont journalisés sans enregistrer le jeton.
      summary: Révoquer le jeton de rafraîchissement
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deconnexion'
            examples:
              RequêteDeDéconnexion:
                value:
                  refresh: <jeton_rafraichissement_exemple>
                summary: Jeton de rafraîchissement à révoquer
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Jeton révoqué; aucun corps de réponse.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
              examples:
                Validation:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: donnees_invalides
                    erreurs:
                      refresh:
                      - Ce champ est obligatoire.
                  summary: Entrée invalide
                  description: Le champ refresh est requis.
                ChampsInconnus:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: champs_inconnus
                    erreurs:
                      champs_inconnus:
                      - 'Champs non autorisés : role'
                  summary: Champ inconnu
                  description: Le corps contient une propriété non autorisée.
                JsonMalforme:
                  value:
                    detail: Le corps JSON est invalide.
                    code: donnees_invalides
                    erreurs: {}
                  summary: JSON malformé
                  description: Le corps ne peut pas être analysé.
                JetonInvalide:
                  value:
                    detail: Le jeton de rafraîchissement est invalide.
                    code: jeton_invalide
                  summary: Jeton invalide
                  description: Le jeton de rafraîchissement est mal formé, expiré
                    ou d’un type incorrect.
          description: Corps invalide ou jeton de rafraîchissement mal formé.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                NonAuthentifie:
                  value:
                    detail: Authentification requise.
                    code: non_authentifie
                  summary: Jeton d’accès absent
                  description: Aucun accès valide n’a été fourni.
                AccesInvalide:
                  value:
                    detail: Le jeton d’accès est invalide.
                    code: jeton_invalide
                  summary: Jeton d’accès invalide
                  description: Le jeton d’accès est falsifié ou associé à un compte
                    désactivé.
                AccesExpire:
                  value:
                    detail: Le jeton d’accès a expiré.
                    code: jeton_expire
                  summary: Jeton d’accès expiré
                  description: Le jeton d’accès a expiré.
          description: Jeton d’accès absent, invalide ou expiré.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                JetonNonAutorise:
                  value:
                    detail: Accès interdit.
                    code: jeton_non_autorise
                  summary: Jeton appartenant à un autre compte
                  description: Le jeton de rafraîchissement n’est pas révoqué.
          description: Le jeton de rafraîchissement appartient à un autre compte.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                MethodeInterdite:
                  value:
                    detail: Méthode non autorisée.
                    code: methode_non_autorisee
                  summary: Méthode interdite
                  description: La route accepte uniquement POST.
          description: Méthode non autorisée.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
              examples:
                TypeContenu:
                  value:
                    detail: Le type de contenu n’est pas pris en charge.
                    code: donnees_invalides
                    erreurs: {}
                  summary: Type de contenu non pris en charge
                  description: Le corps doit être transmis en application/json.
          description: Type de contenu non pris en charge.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                LimiteAtteinte:
                  value:
                    detail: Trop de requêtes. Réessayez après le délai indiqué.
                    code: trop_de_requetes
                  summary: Limite atteinte
                  description: La limite de déconnexions par IP est dépassée.
          description: Limite de débit atteinte; Retry-After est exprimé en secondes.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                ErreurInterne:
                  value:
                    detail: Erreur interne du serveur.
                    code: erreur_interne
                  summary: Erreur interne
                  description: Aucun détail technique n’est exposé.
          description: Erreur interne sans détail technique.
  /api/v1/auth/me/:
    get:
      operationId: consulter_mon_profil
      description: 'Requiert un jeton Bearer d’accès valide. Cette lecture reste autorisée
        si un changement de mot de passe est requis. La réponse ne contient aucun
        identifiant interne, hash de mot de passe ou indicateur superutilisateur.
        Cache-Control: no-store est appliqué.'
      summary: Consulter le profil du compte authentifié
      tags:
      - Authentification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profil'
              examples:
                Succes:
                  value:
                    uuid: 3f1c2b7e-8a4d-4c1e-9b6a-2d5f7e8a9c10
                    email: rakoto@exemple.com
                    nom: Rakoto
                    prenom: Hery
                    telephone: '+261320000000'
                    role: vendeur
                    doit_changer_mot_de_passe: false
                    date_creation: '2026-11-22T09:30:00+03:00'
                    derniere_connexion: '2026-11-22T10:05:12+03:00'
                  summary: Profil du compte
                  description: Profil complet du titulaire du jeton.
                SansConnexion:
                  value:
                    uuid: 3f1c2b7e-8a4d-4c1e-9b6a-2d5f7e8a9c10
                    email: rakoto@exemple.com
                    nom: Rakoto
                    prenom: Hery
                    telephone: ''
                    role: vendeur
                    doit_changer_mot_de_passe: false
                    date_creation: '2026-11-22T09:30:00+03:00'
                    derniere_connexion: null
                  summary: Profil sans connexion précédente
                  description: Le champ derniere_connexion est toujours présent et
                    vaut null.
          description: Profil du titulaire du jeton.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                NonAuthentifie:
                  value:
                    detail: Authentification requise.
                    code: non_authentifie
                  summary: Jeton absent
                  description: Aucun jeton d’accès n’a été transmis.
                JetonExpire:
                  value:
                    detail: Le jeton d’accès a expiré.
                    code: jeton_expire
                  summary: Jeton expiré
                  description: Le jeton d’accès a expiré.
                JetonInvalide:
                  value:
                    detail: Le jeton d’accès est invalide.
                    code: jeton_invalide
                  summary: Jeton invalide
                  description: Le jeton est falsifié, illisible ou associé à un compte
                    désactivé.
          description: Jeton absent, expiré ou invalide.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                MethodeInterdite:
                  value:
                    detail: Méthode non autorisée.
                    code: methode_non_autorisee
                  summary: Méthode interdite
                  description: Seules les méthodes GET et PATCH sont autorisées.
          description: Méthode non autorisée.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                LimiteAtteinte:
                  value:
                    detail: Trop de requêtes. Réessayez après le délai indiqué.
                    code: trop_de_requetes
                  summary: Limite atteinte
                  description: La limite générale par utilisateur est dépassée.
          description: Limite générale de débit atteinte.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                ErreurInterne:
                  value:
                    detail: Erreur interne du serveur.
                    code: erreur_interne
                  summary: Erreur interne
                  description: Aucun détail technique n’est exposé.
          description: Erreur interne sans détail technique.
    patch:
      operationId: modifier_mon_profil
      description: Requiert un jeton Bearer et un changement de mot de passe déjà
        effectué. Seuls nom, prenom et telephone sont modifiables; email, role et
        les champs internes sont refusés. Les modifications sont journalisées. La
        réponse est protégée contre la mise en cache.
      summary: Modifier les champs autorisés du profil connecté
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfilModification'
            examples:
              RequêteDeModificationDuProfil:
                value:
                  nom: Rakoto
                  prenom: Hery
                  telephone: '+261320000000'
                summary: Champs de profil modifiables
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profil'
              examples:
                Succes:
                  value:
                    uuid: 3f1c2b7e-8a4d-4c1e-9b6a-2d5f7e8a9c10
                    email: rakoto@exemple.com
                    nom: Rakoto
                    prenom: Hery
                    telephone: '+261320000000'
                    role: vendeur
                    doit_changer_mot_de_passe: false
                    date_creation: '2026-11-22T09:30:00+03:00'
                    derniere_connexion: '2026-11-22T10:05:12+03:00'
                  summary: Profil modifié
                  description: Les champs autorisés ont été actualisés.
          description: Profil actualisé.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
              examples:
                Validation:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: donnees_invalides
                    erreurs:
                      telephone:
                      - Saisissez un numéro de téléphone valide.
                  summary: Téléphone invalide
                  description: Le format du téléphone est invalide.
                ChampsInconnus:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: champs_inconnus
                    erreurs:
                      champs_inconnus:
                      - 'Champs non autorisés : role'
                  summary: Champ interdit
                  description: L’e-mail, le rôle et les indicateurs internes ne sont
                    pas modifiables.
                JsonMalforme:
                  value:
                    detail: Le corps JSON est invalide.
                    code: donnees_invalides
                    erreurs: {}
                  summary: JSON malformé
                  description: Le corps ne peut pas être analysé.
          description: Donnée invalide, JSON malformé ou champ interdit.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                NonAuthentifie:
                  value:
                    detail: Authentification requise.
                    code: non_authentifie
                  summary: Jeton absent
                  description: Aucun jeton d’accès n’a été transmis.
                JetonInvalide:
                  value:
                    detail: Le jeton d’accès est invalide.
                    code: jeton_invalide
                  summary: Jeton invalide
                  description: Le jeton d’accès est invalide.
                JetonExpire:
                  value:
                    detail: Le jeton d’accès a expiré.
                    code: jeton_expire
                  summary: Jeton expiré
                  description: Le jeton d’accès est expiré.
          description: Jeton Bearer absent, invalide ou expiré.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                ChangementMotDePasseRequis:
                  value:
                    detail: Un changement de mot de passe est requis.
                    code: changement_mot_de_passe_requis
                  summary: Changement de mot de passe requis
                  description: Le titulaire doit changer son mot de passe avant de
                    modifier son profil.
          description: Changement du mot de passe requis avant la modification.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                MethodeInterdite:
                  value:
                    detail: Méthode non autorisée.
                    code: methode_non_autorisee
                  summary: Méthode interdite
                  description: La route accepte uniquement PATCH.
          description: Méthode non autorisée.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
              examples:
                TypeContenu:
                  value:
                    detail: Le type de contenu n’est pas pris en charge.
                    code: donnees_invalides
                    erreurs: {}
                  summary: Type de contenu non pris en charge
                  description: Le corps doit être transmis en application/json.
          description: Type de contenu non pris en charge.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                LimiteAtteinte:
                  value:
                    detail: Trop de requêtes. Réessayez après le délai indiqué.
                    code: trop_de_requetes
                  summary: Limite atteinte
                  description: La limite générale par utilisateur est dépassée.
          description: Limite générale de débit atteinte.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                ErreurInterne:
                  value:
                    detail: Erreur interne du serveur.
                    code: erreur_interne
                  summary: Erreur interne
                  description: Aucun détail technique n’est exposé.
          description: Erreur interne sans détail technique.
  /api/v1/auth/password/change/:
    post:
      operationId: changer_mot_de_passe
      description: Requiert un jeton Bearer. Autorisé même si le compte doit changer
        son mot de passe. Le nouveau mot de passe est validé avec les validateurs
        Django; tous les jetons de rafraîchissement sont révoqués après succès. La
        réponse est non mise en cache et la limite est de 5 tentatives par heure et
        par compte.
      summary: Changer le mot de passe du compte connecté
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangementMotDePasse'
            examples:
              RequêteDeChangementDeMotDePasse:
                value:
                  ancien_mot_de_passe: AncienMotDePasse!2026
                  nouveau_mot_de_passe: NouveauMotDePasse!2026
                  confirmation_nouveau_mot_de_passe: NouveauMotDePasse!2026
                summary: Ancien mot de passe et nouveau secret confirmé
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                Succes:
                  value:
                    detail: Mot de passe modifié. Veuillez vous reconnecter.
                  summary: Mot de passe modifié
                  description: Toutes les sessions précédentes sont fermées.
          description: Mot de passe modifié; reconnexion nécessaire.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurOuValidation'
              examples:
                AncienIncorrect:
                  value:
                    detail: L’ancien mot de passe est incorrect.
                    code: ancien_mot_de_passe_incorrect
                  summary: Ancien mot de passe incorrect
                  description: Le mot de passe actuel ne correspond pas au compte.
                Validation:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: donnees_invalides
                    erreurs:
                      nouveau_mot_de_passe:
                      - Ce mot de passe est trop court. Il doit contenir au minimum
                        12 caractères.
                  summary: Mot de passe faible
                  description: Le nouveau secret ne respecte pas la politique.
                ConfirmationInvalide:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: donnees_invalides
                    erreurs:
                      confirmation_nouveau_mot_de_passe:
                      - La confirmation du mot de passe ne correspond pas.
                  summary: Confirmation invalide
                  description: La confirmation ne correspond pas au nouveau mot de
                    passe.
                MotDePasseIdentique:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: donnees_invalides
                    erreurs:
                      nouveau_mot_de_passe:
                      - Le nouveau mot de passe doit être différent de l’ancien.
                  summary: Mot de passe identique
                  description: Le nouveau mot de passe doit différer de l’ancien.
                ChampsInconnus:
                  value:
                    detail: Les données envoyées sont invalides.
                    code: champs_inconnus
                    erreurs:
                      champs_inconnus:
                      - 'Champs non autorisés : role'
                  summary: Champ interdit
                  description: Seuls les trois champs de mot de passe sont admis.
                JsonMalforme:
                  value:
                    detail: Le corps JSON est invalide.
                    code: donnees_invalides
                    erreurs: {}
                  summary: JSON malformé
                  description: Le corps ne peut pas être analysé.
          description: Ancien secret incorrect, données invalides ou champ inconnu.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                NonAuthentifie:
                  value:
                    detail: Authentification requise.
                    code: non_authentifie
                  summary: Jeton absent
                  description: Aucun jeton d’accès n’a été transmis.
                JetonInvalide:
                  value:
                    detail: Le jeton d’accès est invalide.
                    code: jeton_invalide
                  summary: Jeton invalide
                  description: Le jeton d’accès est invalide.
                JetonExpire:
                  value:
                    detail: Le jeton d’accès a expiré.
                    code: jeton_expire
                  summary: Jeton expiré
                  description: Le jeton d’accès est expiré.
          description: Jeton Bearer absent, invalide ou expiré.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                MethodeInterdite:
                  value:
                    detail: Méthode non autorisée.
                    code: methode_non_autorisee
                  summary: Méthode interdite
                  description: La route accepte uniquement POST.
          description: Méthode non autorisée.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
              examples:
                TypeContenu:
                  value:
                    detail: Le type de contenu n’est pas pris en charge.
                    code: donnees_invalides
                    erreurs: {}
                  summary: Type de contenu non pris en charge
                  description: Le corps doit être transmis en application/json.
          description: Type de contenu non pris en charge.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                LimiteAtteinte:
                  value:
                    detail: Trop de requêtes. Réessayez après le délai indiqué.
                    code: trop_de_requetes
                  summary: Limite atteinte
                  description: La limite par compte est dépassée.
