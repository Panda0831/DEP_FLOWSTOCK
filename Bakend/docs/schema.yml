components:
  schemas:
    ChangementMotDePasse:
      type: object
      description: Valide le changement demandé par le titulaire authentifié.
      properties:
        ancien_mot_de_passe:
          type: string
          writeOnly: true
          description: Mot de passe actuel, transmis sans modification.
          maxLength: 128
        nouveau_mot_de_passe:
          type: string
          writeOnly: true
          description: Nouveau mot de passe conforme aux validateurs configurés.
          maxLength: 128
        confirmation_nouveau_mot_de_passe:
          type: string
          writeOnly: true
          description: Répétition exacte du nouveau mot de passe.
          maxLength: 128
      required:
      - ancien_mot_de_passe
      - confirmation_nouveau_mot_de_passe
      - nouveau_mot_de_passe
    ConfirmationReinitialisation:
      type: object
      description: Valide les champs de confirmation sans révéler l’état du jeton.
      properties:
        uid:
          type: string
          format: uuid
          description: UUID du compte transmis dans le lien.
        token:
          type: string
          writeOnly: true
          description: Jeton à usage unique contenu dans le lien.
          maxLength: 256
        nouveau_mot_de_passe:
          type: string
          writeOnly: true
          description: Nouveau mot de passe conforme aux validateurs configurés.
          maxLength: 128
        confirmation_nouveau_mot_de_passe:
          type: string
          writeOnly: true
          description: Répétition exacte du nouveau mot de passe.
          maxLength: 128
      required:
      - confirmation_nouveau_mot_de_passe
      - nouveau_mot_de_passe
      - token
      - uid
    Connexion:
      type: object
      description: Valide les identifiants sans modifier le mot de passe reçu.
      properties:
        email:
          type: string
          format: email
          description: Adresse e-mail de connexion; espaces externes retirés et casse
            normalisée.
          maxLength: 254
        mot_de_passe:
          type: string
          writeOnly: true
          description: Mot de passe non vide, conservé exactement comme saisi.
          maxLength: 128
      required:
      - email
      - mot_de_passe
    Deconnexion:
      type: object
      description: Valide le jeton à révoquer sans accepter d’autres champs.
      properties:
        refresh:
          type: string
          writeOnly: true
          description: Jeton JWT de rafraîchissement à révoquer.
          maxLength: 8192
      required:
      - refresh
    DemandeReinitialisation:
      type: object
      description: Valide l’adresse utilisée pour demander un lien de réinitialisation.
      properties:
        email:
          type: string
          format: email
          description: Adresse du compte à réinitialiser; la réponse reste identique.
          maxLength: 254
      required:
      - email
    Erreur:
      type: object
      description: Format JSON standard des erreurs sans détails de validation.
      properties:
        detail:
          type: string
          description: Message d’erreur lisible en français.
        code:
          type: string
          description: Code machine stable de l’erreur.
      required:
      - code
      - detail
    ErreurOuValidation:
      type: object
      description: Documente les réponses d’erreur métier ou de validation sous un
        même code HTTP.
      properties:
        detail:
          type: string
          description: Message d’erreur lisible en français.
        code:
          type: string
          description: Code machine stable de l’erreur.
        erreurs:
          type: object
          additionalProperties: {}
          description: Erreurs indexées par champ, présente uniquement lors d’une
            validation.
      required:
      - code
      - detail
    ErreurValidation:
      type: object
      description: Format JSON des erreurs de validation et de parsing.
      properties:
        detail:
          type: string
          description: Message d’erreur lisible en français.
        code:
          type: string
          description: Code machine stable de l’erreur.
        erreurs:
          type: object
          additionalProperties: {}
          description: Erreurs indexées par champ; vide si le JSON ou son type est
            invalide.
      required:
      - code
      - detail
      - erreurs
    PatchedProfilModification:
      type: object
      description: Liste blanche des champs modifiables par le titulaire.
      properties:
        nom:
          type: string
          maxLength: 100
        prenom:
          type: string
          maxLength: 100
        telephone:
          type: string
          maxLength: 20
    PatchedUtilisateurModification:
      type: object
      description: Liste blanche des champs modifiables par un administrateur.
      properties:
        email:
          type: string
          format: email
          description: Adresse e-mail unique, normalisée en minuscules.
          maxLength: 254
        nom:
          type: string
          description: Nom de famille.
          maxLength: 100
        prenom:
          type: string
          description: Prénom.
          maxLength: 100
        telephone:
          type: string
          description: Téléphone optionnel; espaces, tirets et points sont retirés.
          maxLength: 20
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          description: |-
            Rôle métier admin ou vendeur.

            * `admin` - Administrateur
            * `vendeur` - Vendeur
    Profil:
      type: object
      description: Liste blanche des informations visibles par le titulaire du compte.
      properties:
        uuid:
          type: string
          format: uuid
          description: Identifiant public unique du compte.
        email:
          type: string
          format: email
          description: Adresse e-mail normalisée du titulaire.
        nom:
          type: string
          description: Nom de famille du titulaire.
        prenom:
          type: string
          description: Prénom du titulaire.
        telephone:
          type: string
          description: Téléphone du titulaire, vide si non renseigné.
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          description: |-
            Rôle métier actuel du titulaire.

            * `admin` - Administrateur
            * `vendeur` - Vendeur
        doit_changer_mot_de_passe:
          type: boolean
          description: Indique si un changement de mot de passe est exigé.
        date_creation:
          type: string
          format: date-time
          description: Date de création, au format ISO 8601.
        derniere_connexion:
          type: string
          format: date-time
          nullable: true
          description: Dernière connexion au format ISO 8601, nulle si aucune.
      required:
      - date_creation
      - derniere_connexion
      - doit_changer_mot_de_passe
      - email
      - nom
      - prenom
      - role
      - telephone
      - uuid
    Rafraichissement:
      type: object
      description: Valide le jeton reçu sans accepter d’autres champs.
      properties:
        refresh:
          type: string
          writeOnly: true
          description: Jeton JWT de rafraîchissement encore valide.
          maxLength: 8192
      required:
      - refresh
    ReponseConnexion:
      type: object
      description: Réponse JSON émise après une authentification réussie.
      properties:
        access:
          type: string
          description: Jeton JWT d’accès.
        refresh:
          type: string
          description: Jeton JWT de rafraîchissement.
        utilisateur:
          allOf:
          - $ref: '#/components/schemas/UtilisateurResumeConnexion'
          description: Résumé public du compte authentifié.
      required:
      - access
      - refresh
      - utilisateur
    ReponseListeUtilisateurs:
      type: object
      description: Format paginé standard de la liste des utilisateurs.
      properties:
        count:
          type: integer
          description: Nombre total de comptes correspondant aux filtres.
        next:
          type: string
          format: uri
          nullable: true
          description: URL de la page suivante ou null.
        previous:
          type: string
          format: uri
          nullable: true
          description: URL de la page précédente ou null.
        results:
          type: array
          items:
            $ref: '#/components/schemas/UtilisateurAdmin'
          description: Comptes de la page courante, sans données sensibles.
      required:
      - count
      - next
      - previous
      - results
    ReponseRafraichissement:
      type: object
      description: Paire de jetons retournée après une rotation réussie.
      properties:
        access:
          type: string
          description: Nouveau jeton JWT d’accès.
        refresh:
          type: string
          description: Nouveau jeton JWT de rafraîchissement.
      required:
      - access
      - refresh
    RoleEnum:
      enum:
      - admin
      - vendeur
      type: string
      description: |-
        * `admin` - Administrateur
        * `vendeur` - Vendeur
    UtilisateurAdmin:
      type: object
      description: Liste blanche des champs renvoyés aux administrateurs.
      properties:
        uuid:
          type: string
          format: uuid
          description: Identifiant public unique du compte.
        email:
          type: string
          format: email
          description: Adresse e-mail normalisée.
        nom:
          type: string
          description: Nom de famille.
        prenom:
          type: string
          description: Prénom.
        telephone:
          type: string
          description: Téléphone; chaîne vide si non renseigné.
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          description: |-
            Rôle métier du compte.

            * `admin` - Administrateur
            * `vendeur` - Vendeur
        est_actif:
          type: boolean
          description: Indique si le compte peut s’authentifier.
        doit_changer_mot_de_passe:
          type: boolean
          description: Indique si le compte doit changer son mot de passe.
        date_creation:
          type: string
          format: date-time
          description: Date de création avec fuseau horaire.
        derniere_connexion:
          type: string
          format: date-time
          nullable: true
          description: Dernière connexion; null si le compte ne s’est jamais connecté.
        date_dernier_changement_mot_de_passe:
          type: string
          format: date-time
          nullable: true
          description: Dernier changement du mot de passe; null si absent.
        date_modification:
          type: string
          format: date-time
          description: Dernière modification avec fuseau.
      required:
      - date_creation
      - date_dernier_changement_mot_de_passe
      - date_modification
      - derniere_connexion
      - doit_changer_mot_de_passe
      - email
      - est_actif
      - nom
      - prenom
      - role
      - telephone
      - uuid
    UtilisateurCreation:
      type: object
      description: Valide strictement les champs autorisés à la création d’un compte.
      properties:
        email:
          type: string
          format: email
          description: Adresse e-mail unique; espaces retirés et casse normalisée.
          maxLength: 254
        nom:
          type: string
          description: Nom de famille, de 1 à 100 caractères sans caractère de contrôle.
          maxLength: 100
        prenom:
          type: string
          description: Prénom, de 1 à 100 caractères sans caractère de contrôle.
          maxLength: 100
        telephone:
          type: string
          description: Téléphone optionnel; espaces, tirets et points sont retirés.
          maxLength: 20
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: vendeur
          description: |-
            Rôle métier; vendeur par défaut.

            * `admin` - Administrateur
            * `vendeur` - Vendeur
        mot_de_passe_initial:
          type: string
          writeOnly: true
          description: Mot de passe temporaire conforme à la politique de sécurité.
          maxLength: 128
      required:
      - email
      - mot_de_passe_initial
      - nom
      - prenom
    UtilisateurResumeConnexion:
      type: object
      description: Champs de compte autorisés dans une réponse de connexion.
      properties:
        uuid:
          type: string
          format: uuid
          description: Identifiant public unique du compte.
        email:
          type: string
          format: email
          description: Adresse e-mail normalisée du compte.
        nom:
          type: string
          description: Nom de famille du titulaire.
        prenom:
          type: string
          description: Prénom du titulaire.
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          description: |-
            Rôle métier du compte.

            * `admin` - Administrateur
            * `vendeur` - Vendeur
        doit_changer_mot_de_passe:
          type: boolean
          description: Indique si un changement de mot de passe est exigé.
      required:
      - doit_changer_mot_de_passe
      - email
      - nom
      - prenom
      - role
      - uuid
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
